name: TARIRO Studio CI - Build All Targets
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-matrix:
    strategy:
      matrix:
        target: [riscv32-baremetal, wasm-web, verilog-fpga, k8s-cloud, x86-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Toolchains
        run: |
          sudo apt update
          sudo apt install -y qemu-system verilator yosys gcc-riscv64-unknown-elf wabt binaryen nodejs

      - name: Compile TariroLang (skipped - taric compiler not yet packaged)
        run: |
          echo "[INFO] taric compiler not available on CI runners yet - skipping compile step"
          echo "[INFO] Target: ${{ matrix.target }}"
          mkdir -p build
          echo "placeholder" > build/output.txt

      - name: Test Target (skipped - pending taric compiler)
        run: |
          echo "[INFO] Tests skipped until taric compiler is packaged for CI"

      - uses: actions/upload-artifact@v4
        with:
          name: tariro-${{ matrix.target }}
          path: build/

  n1-nist-tests:
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - uses: actions/checkout@v4
      - run: pip install pytest
      - name: Run NIST AI RMF tests (if tests exist)
        run: |
          if [ -d tests/ ]; then
            pytest tests/ -v
          else
            echo "[INFO] No tests directory found - skipping"
          fi
      - name: Verify no network
        run: |
          if [ -f scripts/verify_no_network.py ]; then
            python scripts/verify_no_network.py target/
          else
            echo "[INFO] verify_no_network.py not found - skipping"
          fi
