name: Release — Tag, Changelog & GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Generate changelog
        id: changelog
        run: |
          echo "## Changelog" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD             --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md ||           git log --pretty=format:"- %s (%h)" -20 >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distribution package
        run: |
          pip install build wheel
          echo "[metadata]
          name = tariro-studio
          version = ${VERSION#v}
          description = Tariro Studio - Autonomous Runtime v4
          " > setup.cfg
          echo "from setuptools import setup, find_packages
          setup()" > setup.py
          python -m build --wheel --outdir dist/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: "Tariro Studio ${{ env.VERSION }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(env.VERSION, '-rc') || contains(env.VERSION, '-beta') || contains(env.VERSION, '-alpha') }}
          files: |
            dist/*.whl
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-release:
    name: Post-release checks
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker image was published
        run: |
          echo "Release complete. Docker image should be at:"
          echo "  ghcr.io/${{ github.repository }}:${GITHUB_REF#refs/tags/}"
