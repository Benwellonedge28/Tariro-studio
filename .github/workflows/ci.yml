name: CI — Lint, Type-check, Test & Feature Integrity

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: "."

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff black isort

      - name: Ruff lint
        run: ruff check . --select E,W,F,I --ignore E501 || true

      - name: Black format check
        run: black --check --diff . || true

      - name: isort check
        run: isort --check-only --diff . || true

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps + mypy
        run: |
          pip install mypy
          pip install -r requirements.txt || true

      - name: Run mypy on core modules
        run: |
          mypy tariro/ --ignore-missing-imports --no-strict-optional || true
          mypy app.py --ignore-missing-imports || true

  feature-integrity:
    name: Feature Module Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check all feature modules are importable
        run: |
          python3 - <<'PYCHECK'
          import os, sys, importlib, traceback
          sys.path.insert(0, '.')
          features_dir = 'features'
          files = sorted(f[:-3] for f in os.listdir(features_dir) if f.endswith('.py') and f != '__init__.py')
          failed = []
          for name in files:
              try:
                  importlib.import_module(f'features.{name}')
                  print(f'  OK: {name}')
              except Exception as e:
                  print(f'  FAIL: {name}: {e}')
                  failed.append(name)
          print(f'\nResult: {len(files)-len(failed)}/{len(files)} modules importable')
          if failed:
              print('Failed:', failed)
              sys.exit(1)
          PYCHECK

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests (if they exist)
        run: |
          if [ -d tests/ ] && [ "$(ls -A tests/)" ]; then
            pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
          else
            echo "[INFO] No tests directory found - skipping"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  core-import:
    name: Verify tariro/ core package imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check tariro core imports
        run: |
          python3 - <<'PYCHECK'
          import sys
          sys.path.insert(0, '.')
          modules = [
              'tariro.runtime.autonomy_runtime',
              'tariro.core.event_bus',
              'tariro.core.persistence',
              'tariro.core.pipeline_manager',
              'tariro.core.model_registry',
              'tariro.core.agent_registry',
              'tariro.core.telemetry',
              'tariro.core.security',
              'tariro.core.registry',
              'tariro.core.distributed_task_queue',
              'tariro.core.adaptive_model_router',
              'tariro.core.checkpointing',
              'tariro.core.execution_budget',
              'tariro.core.open_telemetry',
              'tariro.core.models',
          ]
          failed = []
          for m in modules:
              try:
                  __import__(m)
                  print(f'  OK: {m}')
              except Exception as e:
                  print(f'  FAIL: {m}: {e}')
                  failed.append(m)
          if failed:
              sys.exit(1)
          PYCHECK
